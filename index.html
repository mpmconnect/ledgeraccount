<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Accounting Ledger</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1a1d23;--mu:#6b7280;--bd:#d9dce1;--hd:#e9ebef;--ac:#1d4ed8;--cr:#15803d;--dr:#b91c1c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161a;--card:#1d2026;--tx:#eceef2;--mu:#9aa1ad;--bd:#343841;--hd:#272b33;--ac:#6b9bff;--cr:#4ade80;--dr:#f87171}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:12px}
h1{font-size:22px;margin:4px 0 12px;text-align:center}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:12px;max-width:960px;margin-inline:auto}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mu);gap:3px;flex:1 1 140px}
input,select,button{font:inherit;padding:8px;border:1px solid var(--bd);border-radius:6px;background:var(--card);color:var(--tx)}
button{background:var(--ac);color:#fff;border:0;cursor:pointer;font-weight:600}
button.g{background:var(--hd);color:var(--tx)}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:8px;text-align:center}
.sum div{background:var(--hd);border-radius:8px;padding:8px;cursor:pointer}.sum b{display:block;font-size:17px}
.sum small{color:var(--mu)}
.w{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:880px}
th,td{border:1px solid var(--bd);padding:6px 8px;text-align:left;font-size:14px}
th{background:var(--hd)}
td.n,th.n{text-align:right}
.cr{color:var(--cr)}.dr{color:var(--dr)}
tr:nth-child(even) td{background:rgba(128,128,128,.06)}
.x{background:none;color:var(--dr);padding:2px 6px}.tg{display:flex;gap:6px;flex:1 1 220px}.tg button{flex:1;background:var(--hd);color:var(--tx);font-size:15px}.tg button.on.s{background:#16a34a;color:#fff}.tg button.on.p{background:#dc2626;color:#fff}.sum div:nth-child(1){border-top:4px solid #2563eb}.sum div:nth-child(2){border-top:4px solid #16a34a}.sum div:nth-child(3){border-top:4px solid #dc2626}.sum div:nth-child(4){border-top:4px solid #f59e0b}h1{color:var(--ac)}
th:nth-child(2),td:nth-child(2){white-space:nowrap;min-width:105px;width:105px}th:nth-child(5),th:nth-child(6),td:nth-child(5),td:nth-child(6){width:82px;max-width:82px;font-size:13px;padding:6px 4px}
.pd{padding:3px 10px;font-size:12px;background:#16a34a;align-self:flex-start;border-radius:12px}.pd.np{background:#f59e0b}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:12px;z-index:50}.mo.on{display:flex}.mb{background:var(--card);border-radius:10px;max-width:640px;width:100%;max-height:80vh;overflow:auto;padding:14px}.mb table{min-width:0}
.ph{display:none}.bar{height:8px;background:var(--hd);border-radius:4px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:#16a34a}
th:nth-child(5),th:nth-child(6),th:nth-child(7){white-space:nowrap;max-width:none;width:auto}td:nth-child(5),td:nth-child(6),td:nth-child(7){white-space:nowrap;max-width:none}.sum small{white-space:nowrap}
@page{margin:8mm}
@media print{.ph{display:block;text-align:center;margin-bottom:4px;font-size:11px}.ph h2{margin:0;font-size:15px;white-space:nowrap}.sum{grid-template-columns:repeat(5,1fr);gap:4px}.sum div{padding:4px 2px}.sum b{font-size:12px}.sum small{font-size:9px}.card{padding:6px;margin-bottom:6px}table{min-width:0}th,td{font-size:12px;padding:4px}th:nth-child(2),td:nth-child(2){white-space:nowrap;min-width:90px;width:90px}.noprint{display:none}body{background:#fff;color:#000}}
</style></head><body>
<h1 class="noprint">📒 Accounting Ledger</h1>
<div class="ph"><h2 id="phd"></h2></div>
<div class="card noprint"><div class="row">
<label>🗓️ Month<input type="month" id="mon"></label>
<label>🏦 Start balance (₹)<input type="number" id="sb" step="0.01" value="0"></label>
<label>🔍 Search<input id="q" placeholder="Customer or remark"></label>
<button class="g" onclick="window.print()">🖨️ Print</button></div></div>
<div class="card noprint"><div class="row">
<label>📅 Date<input type="date" id="d"></label>
<div class="tg"><button id="bs" class="on s" onclick="setT('Sales')">🛒 Sales</button><button id="bp" class="p" onclick="setT('Purchase')">📦 Purchase</button></div>
<label>👤 Customer name<input id="c" placeholder="Name"></label>
<label>📝 Details<input id="dt" placeholder="Item / details"></label>
<label>💰 Amount (₹)<input type="number" id="a" step="0.01" min="0"></label>
<div style="flex:1 1 160px;display:flex;flex-direction:column;gap:4px"><button id="pb" class="pd" onclick="togP()">✅ Paid</button><label>💬 Remarks<input id="r" placeholder="Optional"></label></div>
<button id="ab" onclick="add()">➕ Add entry</button></div></div>
<div class="card"><div class="sum">
<div onclick="det(1)"><small>🏦 Start balance</small><b id="s1">0</b></div>
<div onclick="det(2)"><small>📈 Sales (Income)</small><b class="cr" id="s2">0</b></div>
<div onclick="det(3)"><small>📉 Purchase (Expense)</small><b class="dr" id="s3">0</b></div>
<div onclick="det(4)"><small>✅ End balance</small><b id="s4">0</b></div>
<div onclick="det(5)" style="border-top:4px solid #9333ea"><small>⏳ Not paid</small><b id="s5">0</b></div></div></div>
<div class="card w"><table><thead><tr><th>No.</th><th>Date</th><th>Type</th><th>Customer name</th><th>Details</th><th class="n">Income (Credit)</th><th class="n">Expense (Debit)</th><th class="n">Balance</th><th>Status</th><th>Remarks</th><th class="noprint"></th></tr></thead><tbody id="tb"></tbody></table></div>
<div class="card noprint" id="sto"></div>
<div class="mo noprint" id="mo" onclick="if(event.target===this)this.classList.remove('on')"><div class="mb"><div id="mt"></div><button style="margin-top:10px" onclick="document.getElementById('mo').classList.remove('on')">Close</button></div></div>
<script>
var K="ledger_v1",S={e:[],sb:{}};
try{var x=localStorage.getItem(K);if(x)S=JSON.parse(x)}catch(e){}
var DB=null;
function idb(cb){try{var r=indexedDB.open("ledgerdb",1);r.onupgradeneeded=function(){r.result.createObjectStore("kv")};r.onsuccess=function(){DB=r.result;cb()};r.onerror=function(){cb()}}catch(e){cb()}}
function idbPut(){if(!DB)return false;try{DB.transaction("kv","readwrite").objectStore("kv").put(JSON.stringify(S),K);return true}catch(e){return false}}
idb(function(){if(!DB)return;try{var g=DB.transaction("kv").objectStore("kv").get(K);g.onsuccess=function(){if(g.result){try{S=JSON.parse(g.result)}catch(e){}}else idbPut();draw()}}catch(e){}});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(function(){});
var $=function(i){return document.getElementById(i)};
var P=true;function togP(){P=!P;var b=$("pb");b.textContent=P?"✅ Paid":"⏳ Not paid";b.className=P?"pd":"pd np"}
function tp(id){S.e.forEach(function(x){if(x.id===id)x.pd=(x.pd===false)});save();draw()}
var EID=null;var T="Sales";function setT(v){T=v;$("bs").className=v==="Sales"?"on s":"s";$("bp").className=v==="Purchase"?"on p":"p"}
function save(){if(!idbPut()){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}}
function f(n){return (+n).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2})}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var today=new Date().toISOString().slice(0,10);
$("d").value=today;$("mon").value=today.slice(0,7);
function add(){
 var a=parseFloat($("a").value);
 if(!$("d").value||!$("c").value.trim()||!(a>=0)){alert("Please enter date, customer name and amount.");return}
 var o={id:Date.now(),d:$("d").value,t:T,c:$("c").value.trim(),dt:$("dt").value.trim(),pd:P,a:a,r:$("r").value.trim()};
 if(EID){S.e=S.e.map(function(y){return y.id===EID?(o.id=EID,o):y});EID=null;$("ab").textContent="➕ Add entry"}else S.e.push(o);
 $("mon").value=$("d").value.slice(0,7);
 $("c").value="";$("dt").value="";$("a").value="";if(!P)togP();$("r").value="";save();draw()}
function det(k){var m=$("mon").value,sb=parseFloat($("sb").value)||0,ti=0,td=0,r="",tot=0,ttl,L=S.e.filter(function(x){return x.d.slice(0,7)===m}).sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:a.id-b.id});
 L.forEach(function(x){if(x.pd!==false){if(x.t==="Sales")ti+=x.a;else td+=x.a}});
 if(k===1||k===4){ttl=k===1?"Start balance":"End balance";r="<table><tr><td>Start balance</td><td class='n'>"+f(sb)+"</td></tr><tr><td>+ Sales (paid)</td><td class='n cr'>"+f(ti)+"</td></tr><tr><td>− Purchase (paid)</td><td class='n dr'>"+f(td)+"</td></tr><tr><th>End balance</th><th class='n'>"+f(sb+ti-td)+"</th></tr></table>"}
 else{var w=k===2?"Sales":"Purchase";ttl=k===2?"Sales (paid)":k===3?"Purchase (paid)":"Not paid";
  L.filter(function(x){var ok=x.pd!==false;return k===5?!ok:ok&&x.t===w}).forEach(function(x){tot+=x.a;var p=x.d.split("-");r+="<tr><td>"+p[2]+"-"+p[1]+"-"+p[0]+"</td>"+(k===5?"<td>"+x.t+"</td>":"")+"<td>"+esc(x.c)+"</td><td>"+esc(x.dt||"")+"</td><td class='n'>"+f(x.a)+"</td></tr>"});
  r="<table><tr><th>Date</th>"+(k===5?"<th>Type</th>":"")+"<th>Customer</th><th>Details</th><th class='n'>Amount</th></tr>"+(r||"<tr><td colspan='5'>No entries</td></tr>")+"<tr><th colspan='"+(k===5?4:3)+"'>Total</th><th class='n'>"+f(tot)+"</th></tr></table>"}
 $("mt").innerHTML="<h3 style='margin:0 0 8px'>"+ttl+" · "+m+"</h3><div class='w'>"+r+"</div>";$("mo").classList.add("on")}
function ed(id){var x=S.e.filter(function(y){return y.id===id})[0];if(!x)return;EID=id;$("d").value=x.d;setT(x.t);$("c").value=x.c;$("dt").value=x.dt||"";$("a").value=x.a;$("r").value=x.r;if((x.pd!==false)!==P)togP();$("ab").textContent="💾 Save changes";window.scrollTo(0,0)}
function del(id){if(confirm("Delete this entry?")){S.e=S.e.filter(function(x){return x.id!==id});save();draw()}}
function draw(){
 var m=$("mon").value,q=$("q").value.toLowerCase();
 $("sb").value=S.sb[m]||0;
 var sb=parseFloat($("sb").value)||0,bal=sb,ti=0,td=0,pend=0,h="",n=0;
 S.e.filter(function(x){return x.d.slice(0,7)===m}).sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:a.id-b.id}).forEach(function(x){
  var s=x.t==="Sales",ok=x.pd!==false;if(ok){if(s){bal+=x.a;ti+=x.a}else{bal-=x.a;td+=x.a}}else pend+=x.a;
  if(q&&(x.c+" "+(x.dt||"")+" "+x.r).toLowerCase().indexOf(q)<0)return;
  n++;var p=x.d.split("-");
  h+="<tr><td>"+n+"</td><td>"+p[2]+"-"+p[1]+"-"+p[0]+"</td><td>"+x.t+"</td><td>"+esc(x.c)+"</td><td>"+esc(x.dt||"")+"</td><td class='n cr'>"+(s?f(x.a):"")+"</td><td class='n dr'>"+(s?"":f(x.a))+"</td><td class='n'>"+f(bal)+"</td><td style='white-space:nowrap'><button class='x' style='color:"+(ok?"#16a34a":"#d97706")+"' onclick='tp("+x.id+")'>"+(ok?"✅ Paid":"⏳ Not paid")+"</button></td><td>"+esc(x.r)+"</td><td class='noprint' style='white-space:nowrap'><button class='x' style='color:var(--ac)' onclick='ed("+x.id+")'>✏️</button><button class='x' onclick='del("+x.id+")'>✕</button></td></tr>"});
 $("tb").innerHTML=h||"<tr><td colspan='11' style='text-align:center;color:var(--mu)'>No entries for this month</td></tr>";
 $("s1").textContent=f(sb);$("s2").textContent=f(ti);$("s3").textContent=f(td);$("s4").textContent=f(bal);$("s5").textContent=f(pend);stor(m)}
function stor(m){var b=0;b=JSON.stringify(S).length*2
var p=Math.min(100,b/(500*1024*1024)*100),t=new Date().toISOString().slice(0,10).split("-");
$("sto").innerHTML="💾 Storage used: <b>"+(b/1024).toFixed(1)+" KB</b> of 500 MB ("+p.toFixed(2)+"%) · "+S.e.length+" entries <small id='qt' style='color:var(--mu)'></small><div class='bar'><i style='width:"+Math.max(p,1)+"%'></i></div>";
if(navigator.storage&&navigator.storage.estimate)navigator.storage.estimate().then(function(e){var q=$("qt");if(q)q.textContent="· device allows "+Math.round(e.quota/1048576)+" MB"}).catch(function(){});
$("phd").textContent=t[2]+"-"+t[1]+"-"+t[0]+"  |  Account Ledger  |  Month: "+m}
window.onbeforeprint=function(){document.title="Account Ledger - "+$("mon").value+" - "+new Date().toISOString().slice(0,10)};
window.onafterprint=function(){document.title="Accounting Ledger"};
$("mon").onchange=draw;$("q").oninput=draw;
$("sb").oninput=function(){S.sb[$("mon").value]=parseFloat($("sb").value)||0;save();draw2()};
function draw2(){var v=$("sb").value,p=document.activeElement;draw();$("sb").value=v}
draw();
</script></body></html>
